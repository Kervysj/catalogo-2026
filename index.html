<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital</title>
    <!-- Configuración para PWA (Instalable) -->
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22Catálogo Digital%22,
        %22short_name%22: %22Catálogo%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23f8fafc%22,
        %22theme_color%22: %22%232563eb%22,
        %22icons%22: [{%22src%22: %22https://cdn-icons-png.flaticon.com/512/1170/1170576.png%22, %22sizes%22: %22512x512%22, %22type%22: %22image/png%22}]
    }">
    
    <!-- Fuente moderna e iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2563eb;       /* Azul principal moderno */
            --primary-hover: #1d4ed8;     /* Azul hover */
            --danger-color: #dc2626;        /* Rojo dinámico para alertas y acentos */
            --danger-hover: #b91c1c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-subtle: 0 4px 6px -1px rgb(0 0 0 / 0.04), 0 2px 4px -2px rgb(0 0 0 / 0.04);
            --shadow-hover: 0 20px 25px -5px rgb(37 99 235 / 0.12), 0 8px 10px -6px rgb(37 99 235 / 0.08);
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 90px;
            opacity: 0;
            animation: fadeInBody 0.5s ease forwards;
        }

        @keyframes fadeInBody {
            to { opacity: 1; }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 15px;
        }

        header h1 {
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--danger-color) 0%, var(--primary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        /* Buscador rápido e interactivo */
        .search-container {
            max-width: 520px;
            margin: 0 auto 25px auto;
            position: relative;
            transition: var(--transition-smooth);
        }

        .search-container:focus-within {
            transform: scale(1.01);
        }

        .search-input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border-radius: 35px;
            border: 2px solid var(--border-color);
            font-size: 1rem;
            outline: none;
            transition: var(--transition-smooth);
            background-color: #ffffff;
            box-shadow: var(--shadow-subtle);
            color: var(--text-main);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.12), var(--shadow-subtle);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--danger-color);
            font-size: 1.1rem;
            transition: var(--transition-smooth);
        }

        .search-input:focus ~ .search-icon {
            color: var(--primary-color);
            transform: translateY(-50%) scale(1.1);
        }

        /* Botones de Filtros Dinámicos */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .filter-btn {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-subtle);
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        /* Grid de Productos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-smooth);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #f1f5f9;
            animation: cardEntrance 0.4s ease forwards;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .card-img-container {
            width: 100%;
            height: 210px;
            overflow: hidden;
            background: #f1f5f9;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover img {
            transform: scale(1.07);
        }

        /* Botón de compartir flotante en la tarjeta */
        .card-share-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.7);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            z-index: 5;
            backdrop-filter: blur(4px);
        }

        .card-share-btn:hover {
            background: var(--primary-color);
            transform: scale(1.1);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-category {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--danger-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            transition: color 0.2s;
        }

        .card:hover .card-title {
            color: var(--primary-color);
        }

        .card-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #059669;
            margin-bottom: 12px;
        }

        .card-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .card:hover .card-hint {
            color: var(--primary-color);
        }

        /* Modal con Zoom Interactivo */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: #ffffff;
            border-radius: 22px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.35);
            transform: scale(0.92) translateY(15px);
            transition: var(--transition-smooth);
            position: relative;
        }

        .modal.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-img-container {
            width: 100%;
            height: 280px;
            background: #f1f5f9;
            overflow: hidden;
            position: relative;
            cursor: zoom-in;
        }

        .modal-img-container.zoomed {
            cursor: zoom-out;
        }

        .modal-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center center;
        }

        .zoom-hint-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.75);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(4px);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--danger-color);
            transform: rotate(90deg) scale(1.1);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .modal-code {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .modal-price {
            font-size: 1.35rem;
            color: #059669;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 0.93rem;
            margin-bottom: 22px;
            line-height: 1.6;
            max-height: 130px;
            overflow-y: auto;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-grow: 1;
            background-color: #25d366;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
        }

        .whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: translateY(-2px);
        }

        .modal-share-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .modal-share-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Spinner */
        .loader-container {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: var(--text-muted);
        }

        .spinner {
            border: 3px solid rgba(37, 99, 235, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Notificación emergente Toast (para cuando se copia al portapapeles) */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f172a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Barra Flotante Interactiva */
        .social-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 999;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            transition: var(--transition-smooth);
            text-decoration: none;
        }

        .social-icon:hover {
            transform: scale(1.12) rotate(5deg);
            box-shadow: 0 10px 22px rgba(0,0,0,0.3);
        }

        .bg-wa { background-color: #25d366; }
        .bg-fb { background-color: #1877f2; }
        .bg-maps { background-color: var(--danger-color); }
        .bg-sug { background-color: #9333ea; }
    </style>
</head>
<body>

    <header>
        <h1>Catálogo Digital</h1>
        <p>Selecciona un producto para ver detalles y realizar tu pedido al instante</p>
    </header>

    <!-- Barra de Búsqueda -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar por nombre, descripción o código..." oninput="filtrarCombinado()">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
    </div>

    <!-- Botones de Filtros -->
    <div class="filters" id="filters-container">
        <button class="filter-btn active" onclick="cambiarCategoria('todos', this)">Todos</button>
    </div>

    <!-- Grid de Productos -->
    <div class="grid" id="product-grid">
        <div class="loader-container">
            <div class="spinner"></div>
            <p>Sincronizando catálogo con Google Sheets...</p>
        </div>
    </div>

    <!-- Ventana Modal -->
    <div class="modal" id="product-modal" onclick="if(event.target === this) cerrarModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-img-container" id="modal-img-container" onclick="toggleZoom(event)">
                <img id="modal-img" class="modal-img" src="" alt="">
                <div class="zoom-hint-badge"><i class="fa-solid fa-magnifying-glass-plus"></i> Clic para zoom</div>
            </div>
            <div class="modal-body">
                <div id="modal-category" class="card-category"></div>
                <h2 id="modal-title" class="modal-title"></h2>
                <div id="modal-code" class="modal-code"></div>
                <div id="modal-price" class="modal-price"></div>
                <p id="modal-desc" class="modal-desc"></p>
                <div class="modal-actions">
                    <a id="modal-wa-btn" class="whatsapp-btn" href="#" target="_blank">
                        <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i> Comprar
                    </a>
                    <button id="modal-share-btn" class="modal-share-btn" title="Compartir producto">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast de Notificación -->
    <div id="toast" class="toast"><i class="fa-solid fa-check-circle" style="color: #22c55e;"></i> ¡Enlace copiado al portapapeles!</div>

    <!-- Botones Flotantes -->
    <div class="social-float">
        <a href="https://wa.me/584149956831?text=Hola,%20vengo%20de%20su%20catálogo%20web%20y%20tengo%20la%20siguiente%20sugerencia:" target="_blank" class="social-icon bg-sug" title="Enviar una sugerencia">
            <i class="fa-solid fa-lightbulb"></i>
        </a>
        <a href="https://wa.me/584149956831?text=Hola,%20vengo%20de%20su%20catálogo%20web%20y%20quiero%20más%20información" target="_blank" class="social-icon bg-wa" title="WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://tinyurl.com/pageimc" target="_blank" class="social-icon bg-fb" title="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="https://maps.app.goo.gl/guVQ4JRGzRMVjUUy9" target="_blank" class="social-icon bg-maps" title="Ubicación">
            <i class="fa-solid fa-location-dot"></i>
        </a>
    </div>

    <script>
        const urlAPI = "https://script.google.com/macros/s/AKfycbyfjv9UscbcmgqeKjx_0j5UxGWK2qpFudgFGcHeCBt252fUfxgkhcQUKH-b8BeZLU8NNg/exec";

        let listaProductosGlobal = [];
        let categoriaSeleccionada = 'todos';
        let isZoomed = false;

        function cargarCatalogo(silencioso = false) {
            fetch(urlAPI)
                .then(response => response.json())
                .then(data => {
                    listaProductosGlobal = data.filter(prod => {
                        if (!prod.status) return false;
                        return prod.status.toString().trim().toLowerCase() === 'disponible';
                    });

                    construirBotonesCategorias(listaProductosGlobal);
                    filtrarCombinado();
                })
                .catch(error => {
                    console.error('Error al conectar con la API:', error);
                    if (!silencioso) {
                        document.getElementById('product-grid').innerHTML = '<p style="text-align:center; grid-column:1/-1; color: var(--danger-color);">Error al cargar los productos. Verifica tu conexión.</p>';
                    }
                });
        }

        function construirBotonesCategorias(productos) {
            const filtrosContainer = document.getElementById('filters-container');
            const categoriasUnicas = [...new Set(productos.map(p => p.categoria ? p.categoria.trim() : 'General'))];
            
            let htmlBotones = `<button class="filter-btn ${categoriaSeleccionada === 'todos' ? 'active' : ''}" onclick="cambiarCategoria('todos', this)">Todos</button>`;
            
            categoriasUnicas.forEach(cat => {
                const isActive = categoriaSeleccionada.toLowerCase() === cat.toLowerCase() ? 'active' : '';
                htmlBotones += `<button class="filter-btn ${isActive}" onclick="cambiarCategoria('${cat}', this)">${cat}</button>`;
            });
            
            filtrosContainer.innerHTML = htmlBotones;
        }

        function cambiarCategoria(cat, elementoBtn) {
            categoriaSeleccionada = cat;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (elementoBtn) {
                elementoBtn.classList.add('active');
            } else {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    if (btn.textContent.trim().toLowerCase() === cat.toLowerCase()) {
                        btn.classList.add('active');
                    }
                });
            }

            filtrarCombinado();
        }

        function filtrarCombinado() {
            const inputVal = document.getElementById('search-input').value;
            const textoBusqueda = inputVal ? inputVal.toLowerCase().trim() : '';
            let listaFiltrada = listaProductosGlobal;

            if (categoriaSeleccionada !== 'todos') {
                listaFiltrada = listaFiltrada.filter(p => {
                    const catProd = p.categoria ? p.categoria.trim().toLowerCase() : 'general';
                    return catProd === categoriaSeleccionada.toLowerCase();
                });
            }

            if (textoBusqueda !== '') {
                listaFiltrada = listaFiltrada.filter(p => {
                    const nombre = p.nombre ? p.nombre.toString().toLowerCase() : '';
                    const desc = p.descripcion ? p.descripcion.toString().toLowerCase() : '';
                    const masDetalles = (p.mas_detalles || p['mas detalles'] || '').toString().toLowerCase();
                    const codigo = (p.codigo_producto || p.id || '').toString().toLowerCase();
                    
                    return nombre.includes(textoBusqueda) || desc.includes(textoBusqueda) || masDetalles.includes(textoBusqueda) || codigo.includes(textoBusqueda);
                });
            }

            mostrarProductos(listaFiltrada);
        }

        function mostrarProductos(lista) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if (lista.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color: var(--text-muted); padding: 40px;">No se encontraron productos o servicios con este criterio de búsqueda.</p>';
                return;
            }

            lista.forEach((prod, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.03}s`;
                card.onclick = () => abrirModal(prod);

                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${prod.imagen}" alt="${prod.nombre}" loading="lazy">
                        <button class="card-share-btn" onclick="event.stopPropagation(); compartirProducto(event, ${JSON.stringify(prod).replace(/"/g, '&quot;')})" title="Compartir">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="card-category">${prod.categoria || 'General'}</div>
                            <h3 class="card-title">${prod.nombre}</h3>
                            <div class="card-price">$${prod.precio}</div>
                        </div>
                        <div class="card-hint"><i class="fa-solid fa-eye"></i> Ver detalles y comprar</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function compartirProducto(event, prod) {
            const textoCompartir = `¡Mira este artículo en nuestro catálogo!\n\n📌 *${prod.nombre}*\n💰 Precio: $${prod.precio}\n📝 ${prod.descripcion || ''}\n🖼️ Foto: ${prod.imagen}\n\n¡Consíguelo aquí!`;

            if (navigator.share) {
                navigator.share({
                    title: prod.nombre,
                    text: textoCompartir,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(textoCompartir + "\n" + window.location.href);
                mostrarToast();
            }
        }

        function mostrarToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function abrirModal(prod) {
            isZoomed = false;
            const imgContainer = document.getElementById('modal-img-container');
            const imgElem = document.getElementById('modal-img');
            imgContainer.classList.remove('zoomed');
            imgElem.style.transform = 'scale(1)';
            imgElem.style.transformOrigin = 'center center';

            imgElem.src = prod.imagen;
            document.getElementById('modal-category').innerText = prod.categoria || '';
            document.getElementById('modal-title').innerText = prod.nombre;
            document.getElementById('modal-code').innerText = `Código: ${prod.codigo_producto || prod.id || 'N/A'}`;
            document.getElementById('modal-price').innerText = `$${prod.precio}`;
            
            let descripcionTexto = prod.descripcion || '';
            let masDetalles = prod.mas_detalles || prod['mas detalles'] || '';
            if (masDetalles) {
                descripcionTexto += `<br><br><strong>Detalles adicionales:</strong> ${masDetalles}`;
            }
            document.getElementById('modal-desc').innerHTML = descripcionTexto;

            let numeroWa = prod.whatsapp ? prod.whatsapp.toString().trim() : "584149956831";
            let categoriaProd = prod.categoria ? prod.categoria.trim().toLowerCase() : '';
            let mensaje = "";

            if (categoriaProd === 'servicios' || categoriaProd === 'servicio') {
                let requisitosLimpios = masDetalles ? masDetalles.replace(/[,/]/g, '\n-') : "Por favor indícame los detalles necesarios.";
                mensaje = encodeURIComponent(`Hola, quiero solicitar el servicio de *${prod.nombre}* ($${prod.precio}).\n\nRequisitos:\n- ${requisitosLimpios}`);
            } else {
                mensaje = encodeURIComponent(`Hola, me interesa este producto:\n\n*Código:* ${prod.codigo_producto || prod.id || 'N/A'}\n*Producto:* ${prod.nombre}\n*Precio:* $${prod.precio}\n*Foto:* ${prod.imagen}`);
            }
            
            document.getElementById('modal-wa-btn').href = `https://wa.me/${numeroWa}?text=${mensaje}`;
            document.getElementById('modal-share-btn').onclick = () => compartirProducto(null, prod);

            document.getElementById('product-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('product-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function toggleZoom(event) {
            const container = event.currentTarget;
            const img = container.querySelector('.modal-img');
            isZoomed = !isZoomed;

            if (isZoomed) {
                const rect = container.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                const xPercent = (x / rect.width) * 100;
                const yPercent = (y / rect.height) * 100;

                img.style.transformOrigin = `${xPercent}% ${yPercent}%`;
                img.style.transform = 'scale(2.2)';
                container.classList.add('zoomed');
            } else {
                img.style.transform = 'scale(1)';
                img.style.transformOrigin = 'center center';
                container.classList.remove('zoomed');
            }
        }

        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                cerrarModal();
            }
        });

        // Carga inicial
        cargarCatalogo(false);

        // Sincronización automática con Google Sheets cada 15 segundos en segundo plano
        setInterval(() => {
            cargarCatalogo(true);
        }, 15000);
    </script>
</body>
</html>
