<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridigi Market - Catálogo Digital y Trámites</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --accent: #06b6d4;
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --whatsapp: #25d366;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 16px;
        }

        [data-theme="dark"] {
            --bg-main: #090d16;
            --surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        /* Header flotante tipo Pill ultra responsive */
        header {
            position: sticky;
            top: 12px;
            z-index: 1000;
            max-width: 1200px;
            margin: 12px auto 0 auto;
            width: calc(100% - 24px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            min-width: 0;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .logo-text {
            min-width: 0;
        }

        .logo-text h1 {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .badge-counter {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--primary);
            color: white;
            font-size: 0.65rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* Animación de Rebote (Bounce) para el Carrito */
        @keyframes cartBounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.25); }
            50% { transform: scale(0.9); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .bounce-animation {
            animation: cartBounce 0.5s ease-in-out;
            border-color: var(--primary) !important;
            color: var(--primary) !important;
        }

        /* Contenedor Principal Responsive */
        main {
            max-width: 1200px;
            margin: 20px auto;
            width: calc(100% - 24px);
            flex: 1;
        }

        /* Barra de búsqueda y categorías dinámicas */
        .search-filter-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 46px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* Pestañas de categorías con scroll fluido sin barra visible */
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            width: 100%;
            scrollbar-width: none; /* Firefox */
        }

        .categories-scroll::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .category-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .category-chip.active, .category-chip:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Grid de Productos Adaptativo */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }

        .product-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .product-img-wrapper {
            position: relative;
            height: 170px;
            background: var(--border);
            overflow: hidden;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .product-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .product-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            gap: 8px;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* Modales Responsivos */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 20px;
            transform: translateY(20px);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
        }

        /* Lista de requisitos obligatorios */
        .requirements-list {
            list-style: none;
            margin: 14px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .requirements-list li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-main);
            background: var(--bg-main);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .requirements-list li i {
            color: var(--success);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-actions button {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
        }

        .btn-cancel {
            background: var(--border);
            color: var(--text-main);
        }

        .btn-confirm {
            background: var(--whatsapp);
            color: white;
        }

        /* Notificación Flotante de Conexión */
        #network-status-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: var(--shadow-md);
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s ease;
        }

        #network-status-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        #network-status-toast.offline {
            border-color: #ef4444;
            color: #ef4444;
        }

        #network-status-toast.online {
            border-color: var(--success);
            color: var(--success);
        }
    </style>
</head>
<body data-theme="light">

    <!-- Header Flotante -->
    <header>
        <a href="#" class="logo-area">
            <div class="logo-icon">B</div>
            <div class="logo-text">
                <h1>Bridigi Market</h1>
                <span>El Tigrito, Anzoátegui</span>
            </div>
        </a>
        <div class="header-actions">
            <button class="icon-btn" id="theme-toggle" title="Cambiar Tema">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="icon-btn" id="cart-btn" title="Carrito">
                <i class="fa-solid fa-bag-shopping" id="cart-icon-elem"></i>
                <span class="badge-counter" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main>
        <div class="search-filter-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Buscar productos, servicios o trámites...">
            </div>
            <!-- Pestañas de categorías generadas automáticamente -->
            <div class="categories-scroll" id="categories-container">
                <!-- Se inyectan dinámicamente con JS -->
            </div>
        </div>

        <div class="products-grid" id="products-grid">
            <!-- Productos inyectados dinámicamente -->
        </div>
    </main>

    <!-- MODAL DE REQUISITOS OBLIGATORIOS -->
    <div class="modal-overlay" id="confirm-requisitos-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="confirm-req-prod-title">Requisitos Obligatorios</h3>
                <button class="close-modal-btn" onclick="cerrarConfirmacionRequisitos()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Asegúrate de cumplir con los siguientes recaudos antes de continuar:</p>
            <ul class="requirements-list" id="confirm-req-list">
                <!-- Requisitos dinámicos -->
            </ul>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarConfirmacionRequisitos()">Cancelar</button>
                <button class="btn-confirm" id="btn-confirm-requisitos-proceder">Sí, los tengo listos</button>
            </div>
        </div>
    </div>

    <!-- Toast de Conexión de Red -->
    <div id="network-status-toast">
        <i class="fa-solid fa-circle" id="network-icon"></i>
        <span id="network-text">Conexión restablecida</span>
    </div>

    <!-- Script de Lógica Avanzada -->
    <script>
        // ================= BASE DE DATOS DE PRODUCTOS =================
        const productosData = [
            {
                id: 1,
                nombre: "Gestión de Fe de Vida / Documentos",
                categoria: "Trámites",
                precio: 5.00,
                descripcion: "Trámite automatizado y asesoría completa para documentación oficial.",
                imagen: "https://images.unsplash.com/photo-1450133064473-71024230f91b?auto=format&fit=crop&w=600&q=80",
                requisitos: ["Cédula de identidad laminada vigente", "Correo electrónico activo", "Datos de contacto de referencia"]
            },
            {
                id: 2,
                nombre: "Taza Personalizada Sublimada",
                categoria: "Sublimación",
                precio: 6.50,
                descripcion: "Taza de cerámica alta calidad con diseño full color personalizado.",
                imagen: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80",
                requisitos: ["Imagen o logotipo en buena resolución (PNG o JPG)"]
            },
            {
                id: 3,
                nombre: "Recarga de Toner Genérico",
                categoria: "Papelería",
                precio: 12.00,
                descripcion: "Servicio técnico de recarga y optimización para cartuchos láser.",
                imagen: "https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=600&q=80",
                requisitos: []
            }
        ];

        let carrito = [];
        let accionPendienteRequisitos = null;

        // ================= RENDERIZADO DE PRODUCTOS =================
        function renderizarProductos(productos) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            if (productos.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 30px;">No se encontraron resultados.</p>`;
                return;
            }

            productos.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <span class="product-tag">${prod.categoria}</span>
                        <img src="${prod.imagen}" alt="${prod.nombre}" loading="lazy">
                    </div>
                    <div class="product-content">
                        <h3 class="product-title">${prod.nombre}</h3>
                        <p class="product-desc">${prod.descripcion}</p>
                        <div class="product-footer">
                            <span class="product-price">$${prod.precio.toFixed(2)}</span>
                            <button class="btn-primary" onclick="manejarAccionProducto(${prod.id})">
                                <i class="fa-solid fa-cart-plus"></i> Pedir
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ================= DETECCIÓN AUTOMÁTICA DE CATEGORÍAS E ÍCONOS INTELIGENTES =================
        function obtenerIconoCategoria(nombreCategoria) {
            const catLower = nombreCategoria.toLowerCase();
            if (catLower.includes('trámite') || catLower.includes('gestion') || catLower.includes('documento')) return 'fa-file-lines';
            if (catLower.includes('sublim') || catLower.includes('regalo') || catLower.includes('personaliz')) return 'fa-mug-hot';
            if (catLower.includes('papel') || catLower.includes('toner') || catLower.includes('oficina')) return 'fa-print';
            if (catLower.includes('tecno') || catLower.includes('red') || catLower.includes('dispositivo')) return 'fa-microchip';
            return 'fa-layer-group'; // Ícono genérico por defecto
        }

        function generarPestanasCategorias() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            // Obtener categorías únicas desde productosData
            const categoriasUnicas = ['Todos', ...new Set(productosData.map(p => p.categoria))];

            categoriasUnicas.forEach((cat, index) => {
                const chip = document.createElement('button');
                chip.className = `category-chip ${index === 0 ? 'active' : ''}`;
                chip.setAttribute('data-category', cat);
                
                const iconoClass = cat === 'Todos' ? 'fa-border-all' : obtenerIconoCategoria(cat);
                chip.innerHTML = `<i class="fa-solid ${iconoClass}"></i> ${cat}`;

                chip.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');

                    if (cat === 'Todos') {
                        renderizarProductos(productosData);
                    } else {
                        renderizarProductos(productosData.filter(p => p.categoria === cat));
                    }
                });

                container.appendChild(chip);
            });
        }

        // ================= ANIMACIÓN DE CARRITO Y CONTADOR =================
        function actualizarContadorCarrito(incrementar = true) {
            if (incrementar) {
                carrito.push(1); // Simula adición interna
            }
            
            const badge = document.getElementById('cart-count');
            const cartBtn = document.getElementById('cart-btn');
            
            badge.innerText = carrito.length;

            // Disparar animación 'bounce' sin interrumpir funcionalidad
            cartBtn.classList.remove('bounce-animation');
            void cartBtn.offsetWidth; // Forzar reflow
            cartBtn.classList.add('bounce-animation');
        }

        // ================= FLUJO DE REQUISITOS OBLIGATORIOS =================
        function abrirConfirmacionRequisitos(callbackAccion, tituloProd, requisitosArray) {
            accionPendienteRequisitos = callbackAccion;
            
            document.getElementById('confirm-req-prod-title').innerText = tituloProd || '¿Tienes todos los requisitos?';
            
            const ul = document.getElementById('confirm-req-list');
            ul.innerHTML = '';
            
            if (requisitosArray && requisitosArray.length > 0) {
                requisitosArray.forEach(req => {
                    ul.innerHTML += `<li><i class="fa-solid fa-circle-check"></i><span>${req}</span></li>`;
                });
            } else {
                ul.innerHTML = `<li><i class="fa-solid fa-circle-check"></i><span>Documentación o recaudos generales vigentes.</span></li>`;
            }
            
            document.getElementById('confirm-requisitos-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function cerrarConfirmacionRequisitos() {
            document.getElementById('confirm-requisitos-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
            accionPendienteRequisitos = null;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btnConfirmarReq = document.getElementById('btn-confirm-requisitos-proceder');
            if (btnConfirmarReq) {
                btnConfirmarReq.onclick = function() {
                    const accion = accionPendienteRequisitos;
                    cerrarConfirmacionRequisitos();
                    if (typeof accion === 'function') {
                        accion(); // Ejecuta acción de pedido sin trabarse
                    }
                };
            }
        });

        function manejarAccionProducto(id) {
            const prod = productosData.find(p => p.id === id);
            if (!prod) return;

            if (prod.requisitos && prod.requisitos.length > 0) {
                abrirConfirmacionRequisitos(() => {
                    ejecutarPedidoWhatsApp(prod);
                }, prod.nombre, prod.requisitos);
            } else {
                ejecutarPedidoWhatsApp(prod);
            }
        }

        function ejecutarPedidoWhatsApp(prod) {
            actualizarContadorCarrito(true); // Activa animación de carrito exitosa
            
            const numeroWhatsApp = "584120000000"; // Reemplazar con tu número de WhatsApp
            const mensaje = encodeURIComponent(`¡Hola Bridigi Market! 👋 Deseo solicitar:\n\n*${prod.nombre}*\nPrecio: $${prod.precio.toFixed(2)}\n\n¿Me indican los pasos siguientes?`);
            window.open(`https://wa.me/${numeroWhatsApp}?text=${mensaje}`, '_blank');
        }

        // ================= BUSCADOR DINÁMICO =================
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtrados = productosData.filter(p => p.nombre.toLowerCase().includes(query) || p.descripcion.toLowerCase().includes(query));
            renderizarProductos(filtrados);
        });

        // ================= TEMA OSCURO / CLARO =================
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            themeToggleBtn.innerHTML = newTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        });

        // ================= MONITOR DE CONEXIÓN =================
        const toast = document.getElementById('network-status-toast');
        const networkText = document.getElementById('network-text');
        const networkIcon = document.getElementById('network-icon');

        window.addEventListener('online', () => {
            toast.className = "show online";
            networkText.innerText = "Conexión a internet restablecida";
            setTimeout(() => toast.className = "", 4000);
        });

        window.addEventListener('offline', () => {
            toast.className = "show offline";
            networkText.innerText = "Sin conexión a internet (Modo Offline)";
        });

        // Inicialización del sistema
        generarPestanasCategorias();
        renderizarProductos(productosData);
    </script>
</body>
</html>
