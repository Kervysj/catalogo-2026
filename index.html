<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo y Carrito</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 15px; border: none; background: #ddd; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; }
        .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .card h3 { font-size: 16px; margin: 0 0 10px 0; }
        .card p { margin: 0 0 10px 0; font-weight: bold; color: #28a745; }
        .card button { padding: 8px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        /* Estilos del Carrito Flotante */
        .cart-floating { position: fixed; bottom: 20px; right: 20px; background: #007bff; color: white; padding: 12px 20px; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-weight: bold; z-index: 1000; }
        
        /* Modal del Carrito */
        .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1001; }
        .cart-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
        .cart-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .cart-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .cart-item-info { flex-grow: 1; font-size: 14px; }
        .checkout-btn { width: 100%; padding: 12px; background: #25d366; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .close-modal { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; float: right; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Pestañas de Categorías -->
    <div class="tabs" id="tabsContainer">
        <button class="tab-btn active" onclick="filtrarCategoria('Todos')">Todos</button>
        <button class="tab-btn" onclick="filtrarCategoria('Escolar')">Escolar</button>
        <button class="tab-btn" onclick="filtrarCategoria('Servicios')">Servicios</button>
        <button class="tab-btn" onclick="filtrarCategoria('Striming')">Striming</button>
        <button class="tab-btn" onclick="filtrarCategoria('Recargas')">Recargas</button>
    </div>

    <!-- Contenedor del Catálogo -->
    <div class="catalog" id="catalogContainer"></div>

    <!-- Botón Flotante del Carrito -->
    <div class="cart-floating" onclick="toggleCart(true)">
        🛒 Carrito (<span id="cartCount">0</span>)
    </div>

    <!-- Modal del Carrito (Factura) -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <button class="close-modal" onclick="toggleCart(false)">X</button>
            <h3>Detalle de Factura</h3>
            <div id="cartItemsContainer"></div>
            <h4>Total General: $<span id="cartTotal">0.00</span></h4>
            <button class="checkout-btn" onclick="enviarFacturaWhatsApp()">Enviar Factura por WhatsApp</button>
        </div>
    </div>

    <script>
        // Simulación de datos que vienen de Google Sheets (Columnas: Código, Nombre, Precio, Imagen, Categoría)
        const productos = [
            { codigo: "1", nombre: "Set de 3 Piezas Escolar", precio: 20.00, imagen: "https://github.com/Kervysj/imccatalog/blob/main/img1.jpg", categoria: "Escolar" },
            { codigo: "2", nombre: "Taza Sublimada", precio: 6.50, imagen: "https://github.com/Kervysj/imccatalog/blob/main/img2.jpg", categoria: "Servicios" },
            { codigo: "3", nombre: "Currículum Bien Diseñado", precio: 2.00, imagen: "https://github.com/Kervysj/imccatalog/blob/main/img3.jpg", categoria: "Servicios" },
            { codigo: "4", nombre: "Netflix Cuenta", precio: 6.00, imagen: "https://github.com/Kervysj/imccatalog/blob/main/img4.jpg", categoria: "Striming" },
            { codigo: "5", nombre: "Recarga Movistar", precio: 1.00, imagen: "https://github.com/Kervysj/imccatalog/blob/main/img5.jpg", categoria: "Recargas" }
        ];

        let carrito = [];
        let categoriaActual = "Todos";

        function renderCatalogo(cat) {
            const container = document.getElementById("catalogContainer");
            container.innerHTML = "";
            
            const filtrados = cat === "Todos" ? productos : productos.filter(p => p.categoria === cat);

            filtrados.forEach(p => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${p.imagen}" alt="${p.nombre}">
                    <div>
                        <h3>${p.nombre}</h3>
                        <p>$${p.precio.toFixed(2)}</p>
                    </div>
                    <button onclick="agregarAlCarrito('${p.codigo}')">Agregar al Carrito</button>
                `;
                container.appendChild(card);
            });
        }

        function filtrarCategoria(cat) {
            categoriaActual = cat;
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
            renderCatalogo(cat);
        }

        function agregarAlCarrito(codigo) {
            const producto = productos.find(p => p.codigo === codigo);
            const enCarrito = carrito.find(item => item.codigo === codigo);

            if (enCarrito) {
                enCarrito.cantidad += 1;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            actualizarContadorCarrito();
        }

        function actualizarContadorCarrito() {
            const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            document.getElementById("cartCount").innerText = totalItems;
            renderizarModalCarrito();
        }

        function toggleCart(abrir) {
            document.getElementById("cartModal").style.display = abrir ? "flex" : "none";
        }

        function renderizarModalCarrito() {
            const container = document.getElementById("cartItemsContainer");
            container.innerHTML = "";
            let totalGeneral = 0;

            if (carrito.length === 0) {
                container.innerHTML = "<p>El carrito está vacío.</p>";
                document.getElementById("cartTotal").innerText = "0.00";
                return;
            }

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;

                const div = document.createElement("div");
                div.className = "cart-item";
                div.innerHTML = `
                    <img src="${item.imagen}" alt="${item.nombre}">
                    <div class="cart-item-info">
                        <strong>[${item.codigo}] ${item.nombre}</strong><br>
                        Cant: ${item.cantidad} x $${item.precio.toFixed(2)}<br>
                        Subtotal: $${subtotal.toFixed(2)}
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById("cartTotal").innerText = totalGeneral.toFixed(2);
        }

        function enviarFacturaWhatsApp() {
            if (carrito.length === 0) return;

            let facturaTexto = "📄 *FACTURA DE COMPRA - SOLICITUD*\n\n";
            let totalGeneral = 0;

            carrito.forEach((item, index) => {
                let subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;
                facturaTexto += `*Item ${index + 1}*\n` +
                                `▪ Código: ${item.codigo}\n` +
                                `▪ Producto: ${item.nombre}\n` +
                                `▪ Cantidad: ${item.cantidad}\n` +
                                `▪ Precio Unitario: $${item.precio.toFixed(2)}\n` +
                                `▪ Subtotal: $${subtotal.toFixed(2)}\n` +
                                `🔗 Imagen: ${item.imagen}\n\n`;
            });

            facturaTexto += `💰 *Total General: $${totalGeneral.toFixed(2)}*\nPor favor confirmar disponibilidad para culminar la compra.`;

            const numeroWhatsApp = "584120000000"; // Reemplaza con tu número de WhatsApp
            const url = `https://api.whatsapp.com/send?phone=${numeroWhatsApp}&text=${encodeURIComponent(facturaTexto)}`;
            window.open(url, "_blank");
        }

        // Inicializar vista
        renderCatalogo("Todos");
    </script>
</body>
</html>
